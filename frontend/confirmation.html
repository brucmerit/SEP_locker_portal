<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservation Confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script defer src="js/api.js"></script>
  <script defer src="js/confirmation.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900" style="font-family: 'Poppins', sans-serif;">

  <section class="max-w-md mx-auto py-16 px-4 text-center">
    <div class="bg-white rounded-2xl shadow-lg p-8">

      <div class="text-green-600 text-5xl mb-4">&#10003;</div>
      <h1 class="text-2xl font-bold mb-2">Locker Reserved!</h1>
      <p class="text-slate-500 mb-6">Show this code at the locker station to open it.</p>

      <p id="reservationCode" class="text-3xl font-mono font-bold tracking-widest bg-slate-100 rounded-lg py-3 mb-6">------</p>

      <div id="details" class="text-left text-sm text-slate-700 flex flex-col gap-2 mb-6">
        <!-- Filled in by confirmation.js -->
      </div>

      <!-- Manage reservation -->
      <div class="border-t border-slate-200 pt-6">
        <p class="text-sm font-semibold text-slate-700 mb-3">Manage this reservation</p>
        <div class="flex gap-3 justify-center mb-4">
          <button id="extendBtn" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition">
            Extend +24h
          </button>
          <button id="cancelBtn" class="text-sm bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 px-4 rounded-lg transition">
            Cancel Reservation
          </button>
        </div>

        <!-- Hidden until Extend/Cancel is clicked - re-verifies identity -->
        <form id="verifyForm" class="hidden flex flex-col gap-3 text-left bg-slate-50 rounded-lg p-4">
          <p id="verifyLabel" class="text-xs text-slate-500"></p>
          <input type="tel" id="verifyMobile" maxlength="8" placeholder="Mobile number"
            class="w-full border border-slate-300 rounded-lg py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <input type="password" id="verifyPin" maxlength="6" placeholder="6-digit PIN"
            class="w-full border border-slate-300 rounded-lg py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p id="verifyError" class="hidden text-red-600 text-xs"></p>
          <button type="submit" id="verifySubmitBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 px-4 rounded-lg transition">
            Confirm
          </button>
        </form>
      </div>

      <a href="index.html" class="inline-block mt-8 bg-slate-800 text-white hover:bg-slate-900 font-semibold py-2 px-4 rounded-lg transition">
        Back to Stations
      </a>
    </div>
  </section>

</body>
</html>
