<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select a Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script defer src="js/api.js"></script>
  <script defer src="js/station.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900" style="font-family: 'Poppins', sans-serif;">

  <!-- Banner -->
  <section class="relative h-64 flex items-end overflow-hidden bg-slate-800">
    <img id="stationImage" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-70" />
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 to-slate-900/10"></div>
    <div class="relative z-10 p-6 w-full max-w-6xl mx-auto">
      <a href="index.html" class="inline-block mb-2 text-sm text-blue-200 hover:text-white">&larr; Back to all stations</a>
      <h1 id="stationTitle" class="text-3xl font-bold text-white">Loading station...</h1>
      <p id="stationAddress" class="text-slate-200"></p>
    </div>
  </section>

  <!-- Legend -->
  <section class="max-w-6xl mx-auto pt-8 px-4 flex gap-6 text-sm">
    <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full bg-green-500 inline-block"></span> Available</div>
    <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full bg-yellow-500 inline-block"></span> Reserved</div>
    <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full bg-red-500 inline-block"></span> Occupied</div>
  </section>

  <!-- Locker Grid -->
  <section class="max-w-6xl mx-auto py-6 px-4">
    <div id="lockerContainer" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4">
      <!-- Locker tiles get added here by station.js -->
    </div>
    <p id="emptyMessage" class="hidden text-slate-500 mt-4">No lockers found for this station.</p>
  </section>

  <!-- Manage Existing Reservation Bar -->
  <section class="max-w-6xl mx-auto py-6 px-4 mt-8 border-t border-slate-200">
    <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <h3 class="font-bold text-lg text-slate-800">Already have a reservation?</h3>
        <p class="text-slate-500 text-sm">Enter your reservation code to modify or cancel it.</p>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <input type="text" id="resCodeInput" placeholder="Enter Code (e.g. RES-123)" class="border border-slate-300 rounded-lg px-4 py-2 text-sm w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <!-- Manage Bar Button -->
<button id="manageBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-5 py-2 rounded-lg transition">
  Manage
</button>
      </div>
    </div>
  </section>

<!-- Manage Modal (Hidden by default) -->
  <div id="manageModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl relative">
      <h2 class="text-xl font-bold text-slate-800 mb-2">Manage Reservation</h2>
      <p id="modalDetails" class="text-sm text-slate-600 mb-4"></p>

      <!-- Form Inputs for PUT (Edit Mobile Number & Password) -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile Number</label>
          <input type="tel" id="updateMobileInput" placeholder="e.g. 91234567" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">New PIN / Password</label>
          <input type="password" id="updatePasswordInput" placeholder="4-digit PIN or password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="mt-6 flex items-center justify-between gap-3">
        <button id="cancelResBtn" class="bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-sm px-4 py-2 rounded-lg transition border border-red-200">
          Cancel Reservation
        </button>
        
        <div class="flex gap-2">
          <button id="closeModalBtn" class="bg-slate-100 text-slate-600 text-sm font-semibold px-4 py-2 rounded-lg">
            Close
          </button>
          <button id="updateResBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
